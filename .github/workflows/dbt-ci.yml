name: dbt build

on:
  push:
    branches: [main]
    paths: ["dbt/**", "database/**"]
  pull_request:
    paths: ["dbt/**", "database/**"]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rover
          POSTGRES_PASSWORD: rover_ci
          POSTGRES_DB: rover_mars
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rover -d rover_mars"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: rover
      DBT_POSTGRES_PASSWORD: rover_ci
      DBT_POSTGRES_DB: rover_mars
      DBT_POSTGRES_SCHEMA: public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-core>=1.8,<1.9" "dbt-postgres>=1.8,<1.9"

      - name: Cargar esquema base (extensiones + tablas)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://rover:rover_ci@localhost:5432/rover_mars" -f database/init.sql
          psql "postgresql://rover:rover_ci@localhost:5432/rover_mars" -f database/schema.sql
          psql "postgresql://rover:rover_ci@localhost:5432/rover_mars" -f database/meda_schema.sql

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir . || true

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir . --project-dir .
