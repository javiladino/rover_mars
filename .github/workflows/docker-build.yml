name: Docker build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [simulator, ingestion, airflow]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: rover-mars-${{ matrix.service }}:ci
